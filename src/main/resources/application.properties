spring.datasource.url=jdbc:mysql://localhost:3306/medistock_db?createDatabaseIfNotExist=true
spring.datasource.username=medistock_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
medistock.alerts.expiry-days=30
medistock.alerts.low-stock-threshold=10
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
